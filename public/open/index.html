<!DOCTYPE html>
<!-- /public/open/index.html -->
<html lang="en" data-color-mode="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ChicCanto | You've got a scratch card</title>
  <meta name="description" content="Someone sent you a ChicCanto scratch card."/>
  <meta property="og:title" content="ChicCanto Scratch Card"/>
  <meta property="og:description" content="Someone sent you a scratch card — open it in your browser."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="https://chiccanto.com/assets/img/preview-messenger.jpg"/>
  <meta property="og:url" content="https://chiccanto.com/open/"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="ChicCanto Scratch Card"/>
  <meta name="twitter:description" content="Someone sent you a scratch card — open it in your browser."/>
  <meta name="twitter:image" content="https://chiccanto.com/assets/img/preview-messenger.jpg"/>
  <link href="/favicon.ico" rel="icon"/>
  <link href="/assets/css/base.css" rel="stylesheet"/>
  <style>
    html, body {
      min-height: 100vh;
      margin: 0;
    }

    body {
      background: #fcf8f5;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(200,180,140,.13) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(190,160,120,.10) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 10%, rgba(220,200,160,.08) 0%, transparent 60%);
    }

    .cc-inapp-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(70, 55, 40, 0.94);
      color: #fff;
      padding: 0.9rem 1.25rem;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.6;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .cc-inapp-banner strong {
      display: block;
      margin-bottom: 0.1rem;
      font-size: 0.95rem;
    }

    .cc-intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem 2.5rem;
      gap: 0.25rem;
      text-align: center;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 500ms ease;
    }
    .cc-intro.is-ready { opacity: 1; }

    .cc-intro__logo {
      width: 90px;
      margin-bottom: 2rem;
      opacity: 0.65;
    }

    .cc-intro__sender {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 500;
      color: #5a4a3a;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      max-width: 640px;
    }

    .cc-intro__sender-name {
      display: block;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 500;
      color: #5a4a3a;
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }

    .cc-intro__sender-sub {
      display: block;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      font-weight: 400;
      color: #7a6a58;
      line-height: 1.3;
    }

    .cc-intro__flavour {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      color: #9a8a78;
      margin-bottom: 2.25rem;
      line-height: 1.5;
    }

    .cc-intro__cta {
      font-size: 1.05rem;
      padding: 0.9rem 2.75rem;
      border-radius: 50px;
      min-width: 210px;
    }

    .cc-intro__powered {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #c0b0a0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .cc-intro__powered img {
      width: 72px;
      opacity: 0.45;
      filter: invert(30%) sepia(10%) saturate(400%) hue-rotate(10deg) brightness(0.7);
    }
  </style>
</head>

<body class="theme-default">

  <div class="cc-inapp-banner" id="inappBanner" style="display:none;">
    <strong>Scratching doesn't work inside this app</strong>
    Tap ··· (iOS) or ⋮ (Android) and choose <em>Open in browser</em>
  </div>

  <div class="cc-intro" id="introScreen">
    <div class="cc-intro__sender" id="introSender">Someone has a surprise for you</div>
    <div class="cc-intro__flavour" id="introFlavour">They've left something just for you</div>
    <button class="btn cc-intro__cta" type="button" id="openCardBtn">Open your card →</button>
    <div class="cc-intro__powered">Powered by <img src="/assets/img/logo1.svg" alt="ChicCanto"></div>
  </div>

  <script>
    (function () {
      const params  = new URLSearchParams(window.location.search);
      const token   = params.get('token');
      const origin  = window.location.origin;
      const cardUrl = token ? `${origin}/card/?token=${encodeURIComponent(token)}` : `${origin}/`;

      const ua       = navigator.userAgent || '';
      const isInApp  = /(FBAN|FBAV|FB_IAB|FB4A|FBMD|Instagram|Messenger)/i.test(ua);
      const isMobile = /(iPhone|iPad|iPod|Android|Mobi)/i.test(ua);

      const introScreen = document.getElementById('introScreen');
      const senderEl    = document.getElementById('introSender');
      const flavourEl   = document.getElementById('introFlavour');
      const openBtn     = document.getElementById('openCardBtn');
      const inappBanner = document.getElementById('inappBanner');

      if (isInApp && isMobile) {
        inappBanner.style.display = 'block';
        introScreen.style.paddingTop = '7rem';
      }

      function getFlavour(card_key) {
        if (!card_key) return "They've left something just for you";
        if (card_key === 'baby-name1')     return "They are revealing a special name";
        if (card_key === 'gender-reveal')  return "They're about to share some big news";
        // NOTE: 'gender-reveal' above is a pre-existing bug — the real key is 'gender-reveal1'
        if (card_key === 'custom-card')    return "They've hidden a message just for you";
        if (/novice|advanced|birthday/i.test(card_key)) return "They've got a prize waiting for you";
        return "They've left something just for you";
      }

      function render(fromLine, card_key) {
        if (fromLine) {
          const name = fromLine.replace(/^from\s+/i, '');
          senderEl.innerHTML = `<span class="cc-intro__sender-name">${name}</span><span class="cc-intro__sender-sub">have a surprise for you</span>`;
        }
        flavourEl.textContent = getFlavour(card_key);
        introScreen.classList.add('is-ready');
      }

      openBtn.addEventListener('click', () => {
        window.location.href = cardUrl;
      });

      if (!token) {
        render(null, null);
        return;
      }

      fetch('/token/' + encodeURIComponent(token))
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          const fromLine = data && data.from_line ? data.from_line : null;
          const card_key = data && data.card_key  ? data.card_key  : null;
          render(fromLine, card_key);
        })
        .catch(function() { render(null, null); });
    })();
  </script>

</body>
</html>

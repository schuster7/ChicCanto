  <style>
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/inter-v20-latin-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/inter-v20-latin-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/assets/fonts/inter-v20-latin-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html.cc-preload .cc-screen,
    html.cc-preload .cc-footer { visibility: hidden; }

    .cc-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(334deg, #4a7aaa, #8ab0cc, #f0f6fc, #dce8f4, #6e9cbc);
      background-size: 300% 300%;
      animation: gradMove 10s ease infinite;
    }

    @keyframes gradMove {
      0%   { background-position: 0% 50%; }
      25%  { background-position: 100% 25%; }
      50%  { background-position: 100% 50%; }
      75%  { background-position: 0% 75%; }
      100% { background-position: 0% 50%; }
    }

    .cc-screen {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: clamp(3.5rem, 12vh, 7rem) 1.5rem;
    }

    .cc-eyebrow {
      align-self: end;
      text-align: center;
      padding-bottom: clamp(2.5rem, 7vh, 5rem);
    }

    .cc-eyebrow__line1 {
      display: block;
      margin-bottom: 0.3rem;
      font-size: clamp(0.82rem, 2vw, 1rem);
      font-weight: 400;
      color: rgba(0,0,0,0.42);
      letter-spacing: 0.03em;
    }

    .cc-eyebrow__line2 {
      display: block;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      font-weight: 700;
      color: rgba(0,0,0,0.72);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cc-logo-wrap {
      align-self: center;
      width: min(560px, 86vw);
    }

    .cc-sender {
      font-size: clamp(0.75rem, 2vw, 0.88rem);
      font-weight: 500;
      color: rgba(0,0,0,0.38);
      letter-spacing: 0.08em;
      text-align: center;
      display: none;
      margin-bottom: 1.2rem;
    }

    #cc-logo {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    #cc-logo path {
      fill: rgba(0,0,0,0.82);
    }

    .cc-bottom {
      align-self: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding-top: clamp(2.5rem, 7vh, 5rem);
    }

    .cc-inapp {
      background: rgba(200,150,20,0.10);
      border: 1px solid rgba(200,150,20,0.25);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      text-align: center;
      width: 100%;
      max-width: 380px;
      display: none;
    }

    .cc-inapp__title {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(150,110,10,0.9);
      margin-bottom: 0.2rem;
    }

    .cc-inapp__body {
      font-size: 0.75rem;
      font-weight: 400;
      color: rgba(130,95,10,0.75);
      line-height: 1.55;
    }

    .cc-sub {
      font-size: clamp(0.72rem, 1.8vw, 0.82rem);
      font-weight: 400;
      color: rgba(0,0,0,0.32);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .cc-cta {
      background: #202023;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      font-weight: 500;
      line-height: 1.22;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .cc-cta:hover { background: #333338; }

    .cc-footer {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      z-index: 20;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.68rem;
      color: rgba(0,0,0,0.22);
    }

    .cc-footer a {
      color: rgba(0,0,0,0.22);
      text-decoration: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .cc-bg { animation: none; }
    }
  </style>
</head>

    <div class="cc-bottom" id="ccBottom">
      <div class="cc-inapp" id="ccInapp">
        <div class="cc-inapp__title">Scratching won't work here</div>
        <div class="cc-inapp__body" id="ccInappBody"></div>
      </div>
      <div class="cc-sub" id="ccSub">No app · No account · Free to open</div>
      <button class="cc-cta" type="button" id="ccCta">Open your card →</button>

  </div>

  <footer class="cc-footer" id="ccFooter">
    <a href="/privacy/">Privacy</a>
    <span aria-hidden="true">·</span>
    <a href="mailto:support@chiccanto.com">support@chiccanto.com</a>
  </footer>

  <script>
  (function () {
    'use strict';

    var params  = new URLSearchParams(window.location.search);
    var token   = params.get('token');
    var cardUrl = token ? '/card/?token=' + encodeURIComponent(token) : '/';
    var ua      = navigator.userAgent || '';

    function detectInApp(ua) {
      if (/(FBAN|FBAV|FB_IAB|FB4A|FBMD)/i.test(ua))                          return 'Facebook';
      if (/Instagram/i.test(ua))                                               return 'Instagram';
      if (/Messenger|MESSENGER/i.test(ua))                                     return 'Messenger';
      if (/WhatsApp/i.test(ua))                                                return 'WhatsApp';
      if (/Snapchat/i.test(ua))                                                return 'Snapchat';
      if (/TikTok|musical\.ly/i.test(ua))                                      return 'TikTok';
      if (/Twitter|XCom/i.test(ua))                                            return 'X';
      if (/LinkedInApp/i.test(ua))                                             return 'LinkedIn';
      if (/Line\//i.test(ua))                                                  return 'LINE';
      if (/MicroMessenger/i.test(ua))                                          return 'WeChat';
      if (/Android/i.test(ua) && /\bwv\b/.test(ua) && !/Chrome/i.test(ua))   return '';
      return null;
    }

    function getSub(card_key) {
      if (card_key === 'gender-reveal1')                              return 'Someone has news to share · No app · No account · Free to open';
      if (card_key === 'custom-card')                                 return 'A message was hidden for you · No app · No account · Free to open';
      if (/novice|advanced|birthday/i.test(card_key || ''))          return 'Scratch to win · No app · No account · Free to open';
      return 'No app · No account · Free to open';
    }

    var isHandheld = /Android|iPhone|iPad|iPod/i.test(ua);
    var inAppName  = detectInApp(ua);

    if (inAppName !== null && isHandheld) {
      var inappEl   = document.getElementById('ccInapp');
      var inappBody = document.getElementById('ccInappBody');
      inappEl.style.display = 'block';
      inappBody.textContent = inAppName
        ? 'You’re viewing this inside ' + inAppName + '. Open the link in Safari or Chrome to use your card.'
        : 'You’re viewing this inside an in-app browser. Open the link in Safari or Chrome to use your card.';
    }

    document.getElementById('ccCta').addEventListener('click', function () {
      window.location.href = cardUrl;
    });

    function reset(fromLine) {
      gsap.set('#ccLine1', { opacity: 0, y: 20 });
      gsap.set('#ccLine2', { opacity: 0, y: 20 });
      if (fromLine) {
        gsap.set('#ccSender', { opacity: 0, y: 20 });
        gsap.set('#cc-logo',  { opacity: 0, y: 20 });
      } else {
        gsap.set('.cc-logo-wrap', { opacity: 0, y: 20 });
      }
      gsap.set('#ccSub',    { opacity: 0, y: 20 });
      gsap.set('#ccCta',    { opacity: 0, y: 20 });
      gsap.set('#ccFooter', { opacity: 0, y: 20 });
      if (document.getElementById('ccInapp').style.display === 'block') {
        gsap.set('#ccInapp', { opacity: 0, y: 20 });
      }
      requestAnimationFrame(function () {
        document.documentElement.classList.remove('cc-preload');
      });
    }

    function play(fromLine, card_key) {
      if (fromLine) {
        var senderEl = document.getElementById('ccSender');
        senderEl.textContent = 'From ' + fromLine.replace(/^from\s+/i, '');
        senderEl.style.display = 'block';
      }
      document.getElementById('ccSub').textContent = getSub(card_key);

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        requestAnimationFrame(function () {
          document.documentElement.classList.remove('cc-preload');
        });
        gsap.set('#ccLine1, #ccLine2, .cc-logo-wrap, #cc-logo, #ccSender, #ccSub, #ccCta, #ccInapp, #ccFooter', { opacity: 1, y: 0 });
        return;
      }

      reset(fromLine);

      var logoTarget   = fromLine ? '#cc-logo'    : '.cc-logo-wrap';
      var logoStart    = fromLine ? 1.35          : 1.15;
      var inappVisible = document.getElementById('ccInapp').style.display === 'block';

      var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      tl.to('#ccLine1',   { opacity: 1, y: 0, duration: 0.75 }, 0.25);
      tl.to('#ccLine2',   { opacity: 1, y: 0, duration: 0.75 }, 0.65);

      if (fromLine) {
        tl.to('#ccSender', { opacity: 1, y: 0, duration: 0.65 }, 1.0);
      }

      tl.to(logoTarget, { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' }, logoStart);

      if (inappVisible) {
        tl.to('#ccInapp', { opacity: 1, y: 0, duration: 0.75 }, 2.2);
      }
      tl.to('#ccSub',    { opacity: 1, y: 0, duration: 0.75 }, 2.2);
      tl.to('#ccCta',    { opacity: 1, y: 0, duration: 0.75 }, 2.55);
      tl.to('#ccFooter', { opacity: 1, y: 0, duration: 0.75 }, 2.55);
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (!token) {
        play(null, null);
        return;
      }
      fetch('/token/' + encodeURIComponent(token))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          play(
            data && data.from_line ? data.from_line : null,
            data && data.card_key  ? data.card_key  : null
          );
        })
        .catch(function () { play(null, null); });
    });

  })();
  </script>
